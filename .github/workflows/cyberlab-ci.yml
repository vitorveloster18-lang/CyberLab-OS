name: CyberLab OS CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          bun run --cwd packages/core fix-node-pty

      - name: Typecheck product & CyberLab packages
        run: |
          bun --cwd packages/schema typecheck
          bun --cwd packages/core typecheck
          bun --cwd packages/server typecheck
          bun --cwd packages/cli typecheck
          bun --cwd packages/gui-plugins typecheck
          if [ -f cyberlab/package.json ]; then bun --cwd cyberlab typecheck; fi

      - name: Verify license compliance & run test suites
        run: |
          bun --cwd packages/schema test
          bun --cwd packages/util test
          if [ -f script/check-cyberlab-licenses.ts ]; then bun run script/check-cyberlab-licenses.ts; fi
          if [ -f cyberlab/package.json ]; then bun test --cwd cyberlab --timeout 60000; fi

  verify-windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies on Windows PowerShell
        shell: pwsh
        run: |
          bun install --ignore-scripts

      - name: Verify CyberLab CDI autonomy, knowledge MCP and training labs on Windows NTFS
        shell: pwsh
        run: |
          bun run script/check-cyberlab-licenses.ts
          bun --cwd cyberlab typecheck
          # `execution` entrou aqui porque escondia falhas reais de Windows: spawn de
          # binario externo (ENOENT), symlink sem permissao (EPERM) e rmSync com handle
          # preso (EBUSY). Sem ele no CI, a suíte so quebrava na máquina de quem rodasse
          # local.
          bun test --cwd cyberlab --timeout 60000 ../tests/cyberlab/partners ../tests/cyberlab/labs ../tests/cyberlab/safety ../tests/cyberlab/knowledge ../tests/cyberlab/execution ../tests/cyberlab/mcp
